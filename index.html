    <style>
      /* Completely hide Google Translate top banner, floating widget icon, popups, and badges */
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      .goog-te-balloon-frame,
      #goog-gt-tt,
      .goog-te-spinner-pos,
      .goog-te-gadget,
      .goog-te-gadget-icon,
      [class*="VIpgJd"],
      div[class*="VIpgJd"],

    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          includedLanguages: 'en,te,hi,ml,kn',
          autoDisplay: false
        }, 'google_translate_element');
      }

      // Lock document.title so the browser tab always stays as "Maiven Survey" in English
      document.title = "Maiven Survey";
      const titleObserver = new MutationObserver(function() {
        if (document.title !== "Maiven Survey") {
          document.title = "Maiven Survey";
        }
      });
      document.addEventListener("DOMContentLoaded", function() {
        var target = document.querySelector('title');
        if (target) {
          titleObserver.observe(target, { subtree: true, characterData: true, childList: true });
        }
      });
    </script>
